# zen-agent-bot gateway config (copy to data/config.yaml for first-run seed → SQLite)

server:
  data_dir: ./data
  max_concurrent_jobs: 2
  admin_listen: 127.0.0.1:8787
  admin_enabled: true

# Discord or Telegram user IDs allowed to use the bots
allowed_user_ids:
  - 123456789012345678  # replace with your user ID

# Optional: faster slash-command sync during setup
discord_guild_id: null  # or your guild ID integer

backends:
  cursor-cli:
    kind: cursor-cli
    command: agent
    force: true
    # model: composer-2.5
  claude-cli:
    kind: claude-cli
    command: claude
    force: true  # --dangerously-skip-permissions
    # model: sonnet
  openrouter:
    kind: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-sonnet-4
    # online: true  # append :online (OpenRouter web search; extra $)
    # chat-only — no shell; set OPENROUTER_API_KEY in .env

agents:
  manager:
    display_name: Zen Manager
    is_manager: true
    workspace: /home/you
    default_backend: cursor-cli
    system_prompt_file: agents/manager/SOUL.md
    skills:
      - create-skill
      - zen-agent-bot-dev
      - obsidian-vault
      - karakeep
    discord:
      enabled: true
      token_env: DISCORD_TOKEN_MANAGER
      agent_channel_id: 1234567890123456789
    telegram:
      enabled: false
      token_env: TELEGRAM_TOKEN_MANAGER
      # agent_chat_id: null  # optional: restrict to one group/DM

  music:
    display_name: Zen Music
    is_manager: false
    workspace: /home/you
    default_backend: cursor-cli
    system_prompt_file: agents/music/SOUL.md
    skills: []
    discord:
      enabled: true
      token_env: DISCORD_TOKEN_MANAGER
      agent_channel_id: 1234567890123456790
    telegram:
      enabled: false
      token_env: TELEGRAM_TOKEN_MUSIC
      # agent_chat_id: null

  general:
    display_name: Zen General
    is_manager: false
    workspace: /home/you
    default_backend: openrouter
    system_prompt_file: agents/general/SOUL.md
    skills: []
    discord:
      enabled: true
      token_env: DISCORD_TOKEN_MANAGER
      agent_channel_id: 1234567890123456791
    telegram:
      enabled: false
      token_env: TELEGRAM_TOKEN_GENERAL
