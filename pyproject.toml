[project]
name = "zen-agent-bot"
version = "0.3.2"
description = "Discord bridge to Cursor Agent on zenbook"
readme = "README.md"
authors = [
    { name = "maximillian1508", email = "maximillian1508@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "cursor-sdk>=1.0.27",
    "discord-py>=2.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.1",
]

[project.scripts]
zen-agent-bot = "zen_agent_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
